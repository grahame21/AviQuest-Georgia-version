<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#06111d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AviQuest Live Flight Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="tracker.css?v=2" />
</head>
<body>
  <header class="tracker-header">
    <button id="backBtn" class="round-button" type="button" aria-label="Back to AviQuest">‹</button>
    <div><small>GG’S ADVENTURE</small><h1>Live Aviation</h1></div>
    <button id="refreshBtn" class="round-button" type="button" aria-label="Refresh aircraft">↻</button>
  </header>

  <nav class="mode-tabs" aria-label="Tracker mode">
    <button class="active" type="button">Live Flight Tracker</button>
    <button id="topArBtn" type="button">Live AR Spotter</button>
  </nav>

  <section class="search-panel">
    <label class="search-box">
      <span>⌕</span>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Flight, aircraft, airline or airport" />
      <button id="clearSearch" type="button" aria-label="Clear search">×</button>
    </label>
    <div class="quick-actions" role="group" aria-label="Quick filters">
      <button id="locateBtn" type="button">◎ My location</button>
      <button id="favouritesBtn" type="button">★ Favourites <span id="favouriteCount">0</span></button>
      <button id="savedBtn" type="button">▣ Saved <span id="savedCount">0</span></button>
    </div>
  </section>

  <main>
    <div id="map" aria-label="Global live aircraft map"></div>
    <div class="status-strip">
      <span id="liveDot" class="live-dot"></span>
      <b id="statusText">Loading the visible map area…</b>
      <span id="aircraftCount">0 aircraft</span>
    </div>
    <button id="listToggle" class="list-toggle" type="button">Aircraft list <span id="listCount">0</span></button>
    <aside id="aircraftList" class="aircraft-list" aria-label="Aircraft list"></aside>

    <section id="detailsPanel" class="details-panel hidden" aria-live="polite">
      <button id="closeDetails" class="close-button" type="button" aria-label="Close details">×</button>
      <div class="details-top">
        <img id="aircraftPhoto" src="images/aircraft-placeholder.svg" alt="Aircraft preview" />
        <div><small id="detailStatus">LIVE</small><h2 id="detailCallsign">Aircraft</h2><p id="detailReg">Registration unavailable</p></div>
      </div>
      <div class="detail-actions favourite-actions">
        <button id="saveFavourite" type="button">☆ Favourite</button>
        <button id="saveItem" type="button">▣ Save aircraft</button>
      </div>
      <div class="detail-grid">
        <div><small>Aircraft</small><b id="detailType">Unknown</b></div>
        <div><small>Distance</small><b id="detailDistance">—</b></div>
        <div><small>Altitude</small><b id="detailAltitude">—</b></div>
        <div><small>Speed</small><b id="detailSpeed">—</b></div>
        <div><small>Heading</small><b id="detailHeading">—</b></div>
        <div><small>Updated</small><b id="detailSeen">—</b></div>
      </div>
      <div class="detail-actions"><button id="centreAircraft" type="button">Centre on map</button><button id="openAr" class="primary" type="button">Open in AR</button></div>
    </section>
  </main>

  <nav class="tracker-nav">
    <button class="active" type="button">🗺️<span>Map</span></button>
    <button id="navNearby" type="button">📍<span>Nearby</span></button>
    <button id="navA7" type="button">★<span>A7-BAF</span></button>
    <button id="navAr" type="button">📡<span>AR</span></button>
    <button id="navHome" type="button">⌂<span>Home</span></button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="tracker.js?v=2"></script>
</body>
</html>
